<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>和诗音聊天</title><link rel="stylesheet" href="compact.css"><link rel="stylesheet" href="computer-chat.css"></head>
<body><main class="card"><header><div class="identity"><span class="dot"></span><strong>诗音</strong><small id="status">我在这里。</small></div><div class="tools"><button id="settings" title="连接与设置" aria-label="连接与设置">⚙</button><button id="close" title="收起聊天 · Esc" aria-label="收起聊天">×</button></div></header>
<div id="messages" role="log" aria-live="polite"><p class="empty">想说什么，直接告诉我吧。</p></div><p id="error" role="alert" hidden></p><p id="compact-notice" role="status" hidden></p>
<form id="chat-form"><label class="sr-only" for="input">发给诗音的消息</label><textarea id="input" rows="2" maxlength="4000" placeholder="和诗音聊聊…" spellcheck="false"></textarea><footer><span>Enter 发送 · Shift+Enter 换行</span><div><button id="stop" type="button">停止</button><button id="send" type="submit">发送 ↑</button></div></footer></form></main><script src="compact.js"></script><script src="computer-chat.js"></script><script src="voice-input.js"></script></body></html>
